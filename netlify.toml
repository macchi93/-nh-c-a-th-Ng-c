[build]
  command = "npm run build"
  publish = "dist"

# Cấu hình plugin html-validate với tham số đầu vào đúng là "path"
[[plugins]]
  package = "netlify-plugin-html-validate"
  [plugins.inputs]
    path = "dist"

# Hỗ trợ định tuyến Single Page Application (SPA fallback)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
